name: Sincronizar efemérides científicas desde OneDrive

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"
  push:
    paths:
      - ".github/workflows/sync-cientificas.yml"
      - "scripts/sync_cientificas.py"

permissions:
  contents: write

concurrency:
  group: sync-cientificas
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl playwright
          python -m playwright install chromium --with-deps

      - name: Sincronizar efemérides científicas
        env:
          SCIENTIFIC_ONEDRIVE_URL: "https://1drv.ms/x/c/f0437e1066d439c2/IQAG-oAXUhAgR6GLr-icPyUEAV8yn94El0QRd_kLoOFteuE?e=D0fVWv"
          SCIENTIFIC_OUTPUT_JSON: "data/cientificas.json"
        run: python scripts/sync_cientificas.py

      - name: Publicar cambios
        run: |
          if git diff --quiet -- data/cientificas.json; then
            echo "Sin cambios en efemérides científicas."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cientificas.json
          git commit -m "Sync efemérides científicas desde Excel maestro"
          git pull --rebase origin main
          git push
