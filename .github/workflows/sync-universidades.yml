name: Sincronizar universidades desde OneDrive

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    paths:
      - ".github/workflows/sync-universidades.yml"
      - "scripts/sync_onedrive.py"

permissions:
  contents: write

concurrency:
  group: sync-universidades
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Sincronizar universidades
        env:
          ONEDRIVE_EXCEL_URL: "https://1drv.ms/x/c/f0437e1066d439c2/IQAv66Gk4KVHSZa9AhJwlOicAUruLJtLe7NfeEkDBUGDljc?e=YIcR7d"
          ONEDRIVE_EXCEL_NAME: "Repositorio_Maestro_Efemerides_Universitarias.xlsx"
          OUTPUT_JSON: "data/universidades.json"
        run: python scripts/sync_onedrive.py

      - name: Publicar cambios
        run: |
          if git diff --quiet -- data/universidades.json; then
            echo "Sin cambios en universidades."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/universidades.json
          git commit -m "Sync universidades desde Excel maestro"
          git pull --rebase origin main
          git push
